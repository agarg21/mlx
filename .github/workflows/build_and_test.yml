name: Build and Test

# Fork-only measurement harness (agarg21/ci-agent): dispatch-only, Linux CPU lanes only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_and_test:
    name: ${{ matrix.os }} (${{ matrix.toolkit }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        os: ['Linux']
        arch: ['x86_64', 'aarch64']
        toolkit: ['cpu']
    runs-on: |-
      ${{ case(matrix.os == 'Windows',
               case(matrix.arch == 'aarch64', 'windows-11-arm',
                    startsWith(matrix.toolkit, 'cuda'), 'windows-2022-large',
                    'windows-2022'),
               case(matrix.arch == 'x86_64' && startsWith(matrix.toolkit, 'cuda'), 'gpu-t4-4-core',
                    matrix.arch == 'aarch64', 'ubuntu-22.04-arm',
                    'ubuntu-22.04'))
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        id: setup
        with:
          toolkit: ${{ matrix.toolkit }}
      - uses: ./.github/actions/build
        with:
          cmake-args: ${{ steps.setup.outputs.cmake-args }}
          # For MSVC, Ninja/Release is the only config supported by ccache.
          debug: ${{ matrix.os != 'Windows' }}
      - name: Check generated Python stubs with ty
        if: matrix.os == 'Linux' && matrix.arch == 'x86_64' && matrix.toolkit == 'cpu'
        run: uvx ty check python/mlx/core
      - uses: ./.github/actions/test-linux
        if: matrix.os == 'Linux' && (matrix.toolkit == 'cpu' || matrix.arch == 'x86_64')
      - uses: ./.github/actions/test-windows
        if: matrix.os == 'Windows' && matrix.toolkit == 'cpu'

